<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Content-Security-Policy: restricts what the renderer page can load.
    - default-src 'self'        only load resources from app bundle
    - script-src 'self'         no inline scripts (XSS prevention)
    - style-src 'self' 'unsafe-inline'  allow inline styles for dynamic theming
    - img-src 'self' data: blob:        allow canvas blob URLs for PDF rendering
    - worker-src blob:          allow PDF.js web worker (loaded as blob URL)
    This is belt-and-suspenders alongside contextIsolation and nodeIntegration:false.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; worker-src blob: file:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vellum</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Title bar — rendered by us because window is frameless -->
    <div id="titlebar">
      <span id="titlebar-title">Vellum</span>
      <div id="titlebar-controls">
        <button class="titlebar-btn" id="btn-minimise" title="Minimise">&#x2212;</button>
        <button class="titlebar-btn" id="btn-maximise" title="Maximise">&#x25A1;</button>
        <button class="titlebar-btn" id="btn-close"    title="Close">&#x2715;</button>
      </div>
    </div>

    <!-- Top toolbar -->
    <div id="toolbar">
      <!-- Row 1: file actions, undo/redo, status, navigation -->
      <div class="toolbar-row" id="toolbar-row-1">
        <button class="tool-btn" id="btn-library" title="File Library">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2.5" width="5" height="15" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="9" y="2.5" width="9" height="6.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <rect x="9" y="11" width="9" height="6.5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="btn-open" title="Open PDF (Ctrl+O)">Open</button>
        <button class="toolbar-btn" id="btn-new-page" title="Add a blank page to sketch on">New Page</button>
        <button class="toolbar-btn" id="btn-export" title="Export note as PDF or .vellum">Export</button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="toolbar-spacer"></div>
        <span class="toolbar-label" id="lbl-save-status"></span>
        <span class="toolbar-label" id="lbl-page"></span>
        <span class="toolbar-label" id="lbl-zoom"></span>
        <button class="toolbar-btn update-badge hidden" id="btn-update" title="Update available — click to download"></button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" id="btn-ink-search" title="Search handwriting (Ctrl+Shift+H)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="12.5" y1="12.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5.5 8.5 Q6.5 6 8.5 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            <path d="M8.5 6.5 Q10 7 9 8.5 Q8 10 9.5 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" id="btn-screenshot" title="Screenshot to clipboard (Ctrl+Shift+S)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 4l1.2-2h3.6L13 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button class="tool-btn" id="btn-fit-page" title="Fit page (F)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4.5" y="2" width="11" height="16" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="tool-btn" id="btn-toggle-panel" title="Toggle pages panel (P)">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="16" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="13" y1="3.5" x2="13" y2="16.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
      <!-- Row 2: drawing tools, colour/size pickers, shape toggles -->
      <div class="toolbar-row" id="toolbar-row-2">
        <div id="tool-group" style="display:flex;gap:2px;align-items:center;"></div>
        <div id="colour-picker" style="display:none;align-items:center;gap:6px;margin-left:8px;"></div>
        <div id="stroke-picker" style="display:none;align-items:center;gap:4px;margin-left:4px;position:relative;overflow:visible;"></div>
        <div id="eraser-mode-picker" style="display:none;align-items:center;gap:4px;margin-left:4px;"></div>
        <div id="pressure-toggle" style="display:none;align-items:center;margin-left:4px;"></div>
        <div id="shape-snap-toggle" style="display:none;align-items:center;margin-left:4px;"></div>
        <div class="toolbar-sep" id="colour-sep" style="display:none;"></div>
      </div>
    </div>

    <!-- Banner slot — empty by default; What's New banner is injected here -->
    <div id="banner-slot"></div>

    <!-- Main content area -->
    <div id="main">
      <div id="sidebar"></div>
      <div id="canvas-container">
        <!-- PDF pages and annotation overlays are mounted here -->
      </div>
      <div id="notes-panel"></div>
    </div>
  </div>

  <!-- Library panel — slide-in drawer from the left -->
  <div id="library-panel">
    <div id="library-inner">
      <div id="library-header">
        <span class="library-title">Files</span>
        <div style="display:flex;gap:4px;align-items:center;">
          <!-- Pin a folder for quick access -->
          <button class="tool-btn" id="btn-library-open-folder" title="Pin folder — saves folder to library for quick access">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 5.5C2 4.67 2.67 4 3.5 4H8l2 2h6.5c.83 0 1.5.67 1.5 1.5v8c0 .83-.67 1.5-1.5 1.5h-13C2.67 17 2 16.33 2 15.5V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
            </svg>
          </button>
          <!-- Create a new folder on disk -->
          <button class="tool-btn" id="btn-library-new-folder" title="New folder on disk">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 5.5C2 4.67 2.67 4 3.5 4H8l2 2h6.5c.83 0 1.5.67 1.5 1.5v8c0 .83-.67 1.5-1.5 1.5h-13C2.67 17 2 16.33 2 15.5V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
              <line x1="10" y1="9" x2="10" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="7.5" y1="11.5" x2="12.5" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="modal-close" id="btn-library-close" title="Close">&#x2715;</button>
        </div>
      </div>
      <!-- Inline input row — shown when creating a new folder -->
      <div id="library-folder-input-row" class="hidden">
        <input id="library-folder-input" type="text" placeholder="Folder name…" autocomplete="off" spellcheck="false"/>
        <button id="library-folder-input-ok" class="library-folder-input-btn library-folder-input-ok">Create</button>
        <button id="library-folder-input-cancel" class="library-folder-input-btn">✕</button>
      </div>
      <div id="library-list"></div>
      <!-- Backup settings footer -->
      <div id="library-backup-footer">
        <span class="library-backup-label">Auto-backup</span>
        <span id="library-backup-path" class="library-backup-path">Not set</span>
        <button id="btn-backup-choose" class="library-backup-btn" title="Choose backup folder">Choose…</button>
        <button id="btn-backup-clear"  class="library-backup-btn library-backup-clear" title="Disable backup" style="display:none">✕</button>
      </div>
    </div>
  </div>

  <!-- Export options modal -->
  <div id="export-modal" class="modal-overlay hidden">
    <div class="modal-card" style="width:340px;">
      <div class="modal-header">
        <span class="modal-title">Export</span>
        <button class="modal-close" id="btn-export-modal-close">&#x2715;</button>
      </div>
      <div class="modal-body" style="padding:16px;display:flex;flex-direction:column;gap:10px;">
        <label class="export-mode-option">
          <input type="radio" name="export-mode" value="vellum" checked />
          <div>
            <span class="export-mode-title">Vellum file (.vellum)</span>
            <span class="export-mode-desc">Share with other Vellum users. Opens directly with all annotations intact.</span>
          </div>
        </label>
        <div class="export-mode-divider">or export as flat PDF</div>
        <label class="export-mode-option" id="export-opt-pages">
          <input type="radio" name="export-mode" value="pages" />
          <div>
            <span class="export-mode-title">Pages only</span>
            <span class="export-mode-desc">Export each page at its original size. Annotations in the margins are cropped.</span>
          </div>
        </label>
        <label class="export-mode-option" id="export-opt-canvas">
          <input type="radio" name="export-mode" value="canvas" />
          <div>
            <span class="export-mode-title">With margin notes</span>
            <span class="export-mode-desc">Expand each page to include annotations drawn outside the page border.</span>
          </div>
        </label>
      </div>
      <div style="padding:0 16px 16px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="toolbar-btn" id="btn-export-modal-cancel">Cancel</button>
        <button class="toolbar-btn" id="btn-export-modal-ok" style="background:var(--accent);color:#fff;">Export…</button>
      </div>
    </div>
  </div>

  <!-- Shortcuts help modal — populated by shortcuts.js -->
  <div id="shortcuts-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Keyboard Shortcuts</span>
        <button class="modal-close" id="btn-shortcuts-close">&#x2715;</button>
      </div>
      <div class="modal-body" id="shortcuts-list"></div>
    </div>
  </div>

  <!-- Search bar — floating overlay, opened by Ctrl+F, closed by Escape -->
  <div id="search-bar" class="hidden">
    <input id="search-input" type="text" placeholder="Search…" autocomplete="off" spellcheck="false" />
    <span id="search-count" class="search-count"></span>
    <button class="search-btn" id="btn-search-prev" title="Previous match (Shift+Enter)">▲</button>
    <button class="search-btn" id="btn-search-next" title="Next match (Enter)">▼</button>
    <button class="search-btn" id="btn-search-close" title="Close (Escape)">✕</button>
  </div>

  <!-- Handwriting search panel — floating overlay, toggled by toolbar ink-search button -->
  <div id="ink-search-panel" class="ink-search-panel hidden">
    <div class="ink-search-header">
      <span class="ink-search-title">Handwriting Search</span>
      <button id="ink-search-close" class="ink-search-close" title="Close">&#x2715;</button>
    </div>

    <div class="ink-search-scope-row">
      <button id="ink-scope-current" class="ink-scope-btn active">This document</button>
      <button id="ink-scope-all"     class="ink-scope-btn">All documents</button>
    </div>

    <div class="ink-search-input-row">
      <input id="ink-search-input" type="text"
             placeholder="Search handwriting…"
             autocomplete="off" spellcheck="false" />
      <button id="ink-search-btn" class="ink-search-go">Search</button>
    </div>

    <div id="ink-search-status" class="ink-search-status"></div>
    <div id="ink-search-progress-wrap" class="ink-search-progress-wrap hidden">
      <div id="ink-search-progress-bar" class="ink-search-progress-bar"></div>
    </div>

    <div id="ink-search-results" class="ink-search-results"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
